<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1f1f">
  <meta name="description" content="Interactive A.R.I.A. demo for tablets. Task, context, plan, code changes, checks and acceptance.">
  <title>// A.R.I.A. — interactive demo</title>
  <link rel="stylesheet" href="styles/main.css">
  <script defer src="data/demo-data.js"></script>
  <script defer src="data/evidence-data.js"></script>
  <script defer src="scripts/demo-engine.js"></script>
  <script defer src="scripts/app.js"></script>
</head>
<body>
  <a class="skip" href="#workspace">Skip to demo</a>
  <div class="app-shell">
    <header class="app-header">
      <a class="wordmark" href="#" id="brand-home" aria-label="A.R.I.A. — go to demo">// A.R.I.A.</a>
      <nav class="app-tabs" aria-label="App sections">
        <button type="button" data-view="demo" aria-current="page">Demo</button>
        <button type="button" data-view="about">About A.R.I.A.</button>
        <button type="button" data-view="team">Team</button>
        <button type="button" data-view="functions">Features</button>
      </nav>
      <div class="header-tools"><button type="button" id="reset-demo" title="Restart the demo">Restart ↺</button><button type="button" id="fullscreen" title="Fullscreen mode">Fullscreen ⤢</button></div>
    </header>
    <main id="workspace" class="workspace" tabindex="-1">
      <aside class="scenario-rail" id="scenario-rail">
        <div class="rail-heading"><span>ONE TASK</span><strong>Change a request status</strong></div>
        <nav id="step-nav" aria-label="Task stages"></nav>
        <div class="rail-progress"><span id="progress-label">Getting started</span><div class="progress-track"><span id="progress-fill"></span></div><button type="button" id="open-journal">Demo log <span id="journal-count">0</span></button></div>
      </aside>
      <section class="screen" id="screen" aria-label="A.R.I.A. demo" tabindex="-1"></section>
    </main>
    <footer class="app-footer"><div id="footer-note">Interactive workflow model · checks from a recorded A.R.I.A. run</div><div class="footer-nav" id="footer-nav"><button type="button" id="prev-step">← Back</button><span id="step-counter">1 / 6</span><button type="button" id="next-step" class="primary">Next →</button></div></footer>
  </div>
  <dialog id="info-dialog" class="info-dialog"><div class="dialog-top"><h2 id="dialog-title">Evidence</h2><button type="button" id="close-dialog" aria-label="Close dialog">Close ×</button></div><div id="dialog-body"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript><p class="noscript">Enable JavaScript to use the interactive demo.</p></noscript>
</body>
</html>
